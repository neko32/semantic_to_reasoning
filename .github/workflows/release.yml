name: Release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab: builds and uploads an artifact, no GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # DuckDB is bundled C++. cross builds inside an image that has a musl C++ toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static binary
        working-directory: app
        run: cross build --release --target x86_64-unknown-linux-musl
      - name: Smoke test (static binary runs on the host)
        run: |
          file app/target/x86_64-unknown-linux-musl/release/s2r
          app/target/x86_64-unknown-linux-musl/release/s2r --version
          app/target/x86_64-unknown-linux-musl/release/s2r --data-dir /tmp/s2r seed
      - name: Package
        run: |
          mkdir -p dist
          cp app/target/x86_64-unknown-linux-musl/release/s2r dist/
          cp app/.env.example dist/
          cp -r analytics dist/analytics
          rm -rf dist/analytics/.venv dist/analytics/target
          tar -C dist -czf s2r-${GITHUB_REF_NAME}-x86_64-linux-musl.tar.gz .
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: s2r-x86_64-linux-musl
          path: s2r-*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: s2r-*.tar.gz
          generate_release_notes: true
