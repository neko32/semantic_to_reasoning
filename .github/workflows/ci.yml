name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, coverage, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests with coverage (LLM, MetricFlow and DuckDB file mocked)
        run: cargo llvm-cov --fail-under-lines 90 --summary-only
      - run: cargo audit

  pipeline:
    name: Pipeline (seed -> dbt build -> MetricFlow -> reasoner)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: astral-sh/setup-uv@v6
      - name: Install dbt + MetricFlow
        working-directory: analytics
        run: uv sync --python 3.14
      - name: End-to-end test with the real dbt and MetricFlow (LLM mocked)
        working-directory: app
        run: cargo test --test integration -- --ignored
