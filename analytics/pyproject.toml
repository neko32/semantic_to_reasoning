[project]
name = "s2r-analytics"
version = "0.1.0"
description = "Medallion (Bronze/Silver/Gold) + MetricFlow semantic layer for the semantic_to_reasoning POC"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "dbt-metricflow[dbt-duckdb]>=0.15,<0.16",
    "duckdb>=2.0,<2.1",
]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=9"]

[tool.uv]
package = false
